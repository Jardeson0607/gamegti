<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo Brecha: O Incidente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0a0c16;
            background-image: radial-gradient(circle at 50% 50%, #121829 0%, #0a0c16 100%);
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between select-none relative">

    <div id="screen-gameover" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-center items-center p-6">
        <div id="modal-gameover-box" class="w-full max-w-sm bg-slate-900 border-2 p-6 rounded-2xl text-center shadow-2xl">
            <div id="go-badge" class="inline-block px-3 py-0.5 rounded-full font-cyber text-[10px] font-black uppercase mb-3 tracking-widest bg-blue-950 text-blue-400 border border-blue-500/30">
                STATUS DA REDE
            </div>
            <h2 id="go-titulo" class="text-2xl font-cyber font-black tracking-tight uppercase mb-2 text-white">Fim de Jogo</h2>
            <div class="p-3 bg-black/40 border border-slate-800 rounded-xl mb-5">
                <p id="go-motivo" class="text-xs text-slate-300 font-mono leading-relaxed">Incidente resolvido.</p>
            </div>
            <button onclick="reiniciarPartida()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-cyber font-bold text-xs uppercase py-2.5 rounded-xl tracking-wider transition-all shadow-lg">
                🔄 JOGAR NOVAMENTE
            </button>
        </div>
    </div>

    <header class="w-full bg-slate-900/90 border-b border-slate-800 p-3 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs font-bold">
            <div class="flex items-center gap-1.5 text-red-400">
                <span>❤️ IS:</span> <span id="num-is" class="font-cyber text-sm">50</span>
            </div>
            <div class="flex items-center gap-1.5 text-amber-400">
                <span>☣️ DC:</span> <span id="num-dc" class="font-cyber text-sm">0/20</span>
            </div>
            <div class="flex items-center gap-1.5 text-blue-400">
                <span>🛡️ NG:</span> <span id="num-ng" class="font-cyber text-sm">0/20</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-3 flex-1 flex flex-col justify-center gap-4 py-4">
        
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-center shadow-lg">
            <div class="text-[11px] text-slate-400 uppercase tracking-widest mb-1 font-cyber">VEZ DO JOGADOR</div>
            <div id="txt-turno-ativo" class="text-xl font-cyber font-black uppercase text-green-400 tracking-wider">💻 INVASOR (HACKER)</div>
            <p class="text-[11px] text-slate-500 mt-1">Escolha 1 carta da sua mão abaixo para disparar o efeito imediatamente.</p>
        </div>

        <div class="bg-black/60 border border-slate-900 rounded-xl p-3">
            <div class="text-[9px] font-cyber text-slate-500 uppercase tracking-wider mb-1">Último Acontecimento:</div>
            <div id="txt-log" class="text-xs text-emerald-400 font-mono italic">> Partida iniciada! Hacker começa atacando.</div>
        </div>

    </main>

    <section class="w-full max-w-md mx-auto p-3 bg-slate-950 border-t border-slate-800 rounded-t-2xl">
        <div class="flex justify-between items-center mb-3 px-1">
            <span class="text-xs uppercase tracking-wider font-bold text-slate-400">Cartas Disponíveis</span>
            <div class="flex gap-1 bg-slate-900 p-0.5 rounded-md border border-slate-800">
                <button id="btn-tab-hacker" onclick="alternarMao('invasor')" class="text-[10px] font-cyber px-2 py-0.5 rounded bg-green-500 text-black font-bold">HACKER</button>
                <button id="btn-tab-corp" onclick="alternarMao('corp')" class="text-[10px] font-cyber px-2 py-0.5 rounded text-slate-400 font-bold">TI (RIOT)</button>
            </div>
        </div>
        
        <div id="carrossel-cartas" class="flex gap-3 overflow-x-auto pb-2 px-1 no-scrollbar snap-x snap-mandatory">
            </div>
    </section>

    <script>
        [span_0](start_span)[span_1](start_span)// ESTADO SIMPLIFICADO DO PROTÓTIPO[span_0](end_span)[span_1](end_span)
        let game = {
            is: 50, dc: 0, ng: 0,
            [span_2](start_span)turno: "invasor", // "invasor" ou "corp"[span_2](end_span)
            abaAtiva: "invasor"
        };

        [span_3](start_span)[span_4](start_span)[span_5](start_span)[span_6](start_span)// BARALHOS LINDOS E COMPLETAMENTE DIRETOS (SEM COMPLEXIDADE DE CP)[span_3](end_span)[span_4](end_span)[span_5](end_span)[span_6](end_span)
        const baralhoHacker = [
            { id: "h1", nome: "SMS Phishing", sub: "Engenharia Social", desc: "Ataque rápido de engenharia social. Causa +4 de Dados Comprometidos (DC).", cor: "from-green-950 to-emerald-900", bcor: "border-green-500", acao: () => { game.dc += 4; log("Hacker usou SMS Phishing e roubou credenciais humanas (+4 DC)."); } },
            { id: "h2", nome: "Zero-Day Exploit", sub: "Cibermeameaça", desc: "Ataque severo ao servidor. Reduz a Integridade (IS) em 8 pontos.", cor: "from-red-950 to-red-900", bcor: "border-red-500", acao: () => { game.is -= 8; log("💥 Hacker disparou um Zero-Day no servidor da Riot (-8 IS)."); } },
            { id: "h3", nome: "Movimentação Lateral", sub: "Infraestrutura", desc: "Varredura interna na rede. Causa -4 IS e garante +2 DC.", cor: "from-zinc-900 to-zinc-800", bcor: "border-emerald-400", acao: () => { game.is -= 4; game.dc += 2; log("Hacker infiltrou-se lateralmente: -4 IS e +2 DC."); } },
            { id: "h4", nome: "Extorsão Ransomware", sub: "Chantagem", desc: "Criptografa arquivos sensíveis da empresa. Causa +5 DC instantaneamente.", cor: "from-amber-950 to-amber-900", bcor: "border-amber-500", acao: () => { game.dc += 5; log("Ransomware ativo! Dados bloqueados por chantagem (+5 DC)."); } }
        ];

        const baralhoCorp = [
            { id: "c1", nome: "Patch de Emergência", sub: "Mitigação ITIL", desc: "Correção rápida de vulnerabilidade. Restaura +8 pontos de IS.", cor: "from-blue-950 to-slate-900", bcor: "border-blue-500", acao: () => { game.is = Math.min(50, game.is + 8); log("TI aplicou um Patch de Emergência e blindou a rede (+8 IS)."); } },
            { id: "c2", nome: "Auditoria COBIT", sub: "Governança COBIT", desc: "Processos e políticas de segurança. Garante +5 de Governança (NG).", cor: "from-indigo-950 to-slate-900", bcor: "border-indigo-400", acao: () => { game.ng += 5; log("Auditoria realizada! Processos alinhados ao COBIT (+5 NG)."); } },
            { id: "c3", nome: "Transparência Pública", sub: "Efeito / Resposta", desc: "Pronunciamento oficial. Recupera +4 de IS e ganha +2 de NG.", cor: "from-teal-950 to-slate-900", bcor: "border-teal-500", acao: () => { game.is = Math.min(50, game.is + 4); game.ng += 2; log("TI foi transparente com a comunidade. Estabilidade recuperada (+4 IS, +2 NG)."); } },
            { id: "c4", nome: "Isolamento de Backup", sub: "Recuperação ITIL", desc: "Restaura o sistema para um ponto limpo. Reduz Dados Comprometidos (DC) em 4.", cor: "from-cyan-950 to-slate-900", bcor: "border-cyan-500", acao: () => { game.dc = Math.max(0, game.dc - 4); log("Backups restaurados de forma segura! Dados limpos (-4 DC)."); } }
        ];

        function renderizarMao() {
            const carrossel = document.getElementById("carrossel-cartas");
            carrossel.innerHTML = "";
            const cartasAtuais = game.abaAtiva === "invasor" ? baralhoHacker : baralhoCorp;

            cartasAtuais.forEach(c => {
                carrossel.innerHTML += `
                    <div class="snap-center shrink-0 w-[140px] h-[210px] bg-gradient-to-b ${c.cor} border-2 ${c.bcor} rounded-xl p-3 flex flex-col justify-between text-left relative transition-all active:scale-95">
                        <div>
                            <div class="text-[8px] uppercase tracking-widest text-white/50 font-cyber font-bold mb-0.5">${c.sub}</div>
                            <h3 class="text-xs font-cyber font-bold text-white tracking-wide leading-tight">${c.nome}</h3>
                            <p class="text-[10px] text-slate-300 leading-tight mt-2 border-t border-white/10 pt-2 font-sans">${c.desc}</p>
                        </div>
                        <button onclick="usarCarta('${c.id}')" class="w-full bg-white/10 hover:bg-white/20 text-white border border-white/20 text-[9px] font-cyber font-bold py-1 rounded-md uppercase tracking-wider transition-colors">
                            JOGAR CARTA
                        </button>
                    </div>`;
            });
        }

        function usarCarta(id) {
            if (game.turno !== game.abaAtiva) {
                alert("Não é o seu turno! Passe o celular ou mude a aba para o jogador ativo.");
                return;
            }

            // Executa o efeito da carta clicada
            let list = game.turno === "invasor" ? baralhoHacker : baralhoCorp;
            let carta = list.find(c => c.id === id);
            carta.acao();

            [span_7](start_span)// Passa o turno automaticamente após jogar a carta[span_7](end_span)
            if (game.turno === "invasor") {
                game.turno = "corp";
                game.abaAtiva = "corp";
            } else {
                game.turno = "invasor";
                game.abaAtiva = "invasor";
            }

            atualizarTela();
        }

        function atualizarTela() {
            [span_8](start_span)[span_9](start_span)// Atualiza os contadores principais do topo[span_8](end_span)[span_9](end_span)
            document.getElementById("num-is").innerText = game.is;
            document.getElementById("num-dc").innerText = `${game.dc}/20`;
            document.getElementById("num-ng").innerText = `${game.ng}/20`;

            [span_10](start_span)// Atualiza o painel central de turnos[span_10](end_span)
            const txtTurno = document.getElementById("txt-turno-ativo");
            if (game.turno === "invasor") {
                txtTurno.innerText = "💻 INVASOR (HACKER)";
                txtTurno.className = "text-xl font-cyber font-black uppercase text-green-400 tracking-wider";
            } else {
                txtTurno.innerText = "🏢 DEFENSOR (TI RIOT)";
                txtTurno.className = "text-xl font-cyber font-black uppercase text-blue-400 tracking-wider";
            }

            // Sincroniza visualmente os botões das abas
            alternarMao(game.abaAtiva);
            checarVitoria();
        }

        function alternarMao(lado) {
            game.abaAtiva = lado;
            const btnH = document.getElementById("btn-tab-hacker");
            const btnC = document.getElementById("btn-tab-corp");

            if (lado === "invasor") {
                btnH.className = "text-[10px] font-cyber px-2 py-0.5 rounded bg-green-500 text-black font-bold";
                btnC.className = "text-[10px] font-cyber px-2 py-0.5 rounded text-slate-400 font-bold";
            } else {
                btnC.className = "text-[10px] font-cyber px-2 py-0.5 rounded bg-blue-500 text-white font-bold";
                btnH.className = "text-[10px] font-cyber px-2 py-0.5 rounded text-slate-400 font-bold";
            }
            renderizarMao();
        }

        function log(texto) {
            document.getElementById("txt-log").innerText = `> ${texto}`;
        }

        // NOVO MONITOR DE TELA DE FIM DE JOGO CUSTOMIZADA (SUBSTITUTO DA image_491edb.png)
        function checarVitoria() {
            [span_11](start_span)if (game.is <= 0) mostrarModalFim("Hacker Venceu!", "A integridade da infraestrutura chegou a zero. O servidor foi derrubado!", "hacker");[span_11](end_span)
            [span_12](start_span)else if (game.dc >= 20) mostrarModalFim("Hacker Venceu!", "O código-fonte secreto da Riot foi totalmente vazado na internet!", "hacker");[span_12](end_span)
            [span_13](start_span)else if (game.ng >= 20) mostrarModalFim("A TI Venceu!", "Controles de Governança COBIT/ITIL aplicados. Ataque mitigado com sucesso!", "defesa");[span_13](end_span)
        }

        function mostrarModalFim(titulo, motivo, vencedor) {
            const screen = document.getElementById("screen-gameover");
            const box = document.getElementById("modal-gameover-box");
            const badge = document.getElementById("go-badge");
            const titleEl = document.getElementById("go-titulo");
            const motivoEl = document.getElementById("go-motivo");

            titleEl.innerText = titulo;
            motivoEl.innerText = motivo;

            if (vencedor === "hacker") {
                badge.className = "inline-block px-3 py-0.5 rounded-full font-cyber text-[10px] font-black uppercase mb-3 tracking-widest bg-red-950 text-red-400 border border-red-500/30";
                box.className = "w-full max-w-sm bg-zinc-950 border-2 border-red-500 p-6 rounded-2xl text-center shadow-2xl shadow-red-900/40";
                titleEl.className = "text-2xl font-cyber font-black tracking-tight uppercase mb-2 text-red-500";
            } else {
                badge.className = "inline-block px-3 py-0.5 rounded-full font-cyber text-[10px] font-black uppercase mb-3 tracking-widest bg-blue-950 text-blue-400 border border-blue-500/30";
                box.className = "w-full max-w-sm bg-zinc-950 border-2 border-blue-500 p-6 rounded-2xl text-center shadow-2xl shadow-blue-900/40";
                titleEl.className = "text-2xl font-cyber font-black tracking-tight uppercase mb-2 text-blue-400";
            }

            screen.classList.remove("hidden");
        }

        function reiniciarPartida() {
            document.getElementById("screen-gameover").classList.add("hidden");
            [span_14](start_span)[span_15](start_span)game = { is: 50, dc: 0, ng: 0, turno: "invasor", abaAtiva: "invasor" };[span_14](end_span)[span_15](end_span)
            log("Nova partida iniciada! Hacker começa.");
            atualizarTela();
        }

        // Execução inicial
        atualizarTela();
    </script>
</body>
</html>
